name: CI

on:
  push:
    branches:
      - main
      - 'release/**'

  pull_request:
    branches:
      - main
      - 'release/**'

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
    concurrency:
      group: beat-checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download all

      - name: Check module files
        run: go mod tidy -diff

      - name: Check release validation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Compile Windows tests
        env:
          GOOS: windows
          GOARCH: amd64
        run: go test -exec=true ./...
